name: Redraw the README cards

on:
  schedule:
    - cron: "17 3 * * *" # once a day
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.56.0
      # CARDS_TOKEN is optional: a personal token counts private contributions
      # the way the profile itself does; the default token sees public ones.
      - run: python3 scripts/render_cards.py
        env:
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "cards: redraw from today's contributions"
          git push
