<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185.79 64" width="185.79" height="64" role="img" aria-label="Hugging Face"><style>@font-face{font-family:'Unbounded';font-weight:600;src:url(data:font/woff;base64,) format('woff')}
text{font-family:'Manrope',system-ui,sans-serif;font-weight:500}
.d{font-family:'Unbounded','Arial Black',sans-serif;font-weight:800}
.d6{font-family:'Unbounded','Arial Black',sans-serif;font-weight:600}
.b{font-weight:700}
.cap{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:.14em}
.r{opacity:0;animation:rise .8s cubic-bezier(0.23, 1, 0.32, 1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}

.bob{animation:bob 2.6s ease-in-out 1.4s infinite}
@keyframes bob{0%,70%,100%{transform:none}82%{transform:translateY(3px)}}
.nudge{animation:nudge 2.8s ease-in-out 1.6s infinite}
@keyframes nudge{0%,70%,100%{transform:none}82%{transform:translate(2px,-2px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.r{opacity:1}}
</style><g transform="translate(6 0)"><defs><clipPath id="c"><rect width="173.79" height="52" rx="26.0"/></clipPath></defs><g clip-path="url(#c)"><rect width="173.79" height="52" fill="#f3f3f1"/></g><rect x="1" y="1" width="171.79" height="50" rx="25.0" fill="none" stroke="#0b0b12" stroke-width="2"/><text x="86.9" y="31.4" text-anchor="middle" class="d6" font-size="15" fill="#0b0b12">Hugging Face</text></g></svg>
